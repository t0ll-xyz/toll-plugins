[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toll-sdk"
version = "0.3.0"
description = "Client for Toll's checks on Robinhood Chain over MCP: coins, dev records, LARP, ERC-8004 agents, pre-sign checks (check_tx, ERC-8265) and Robinhood Stock Token data. Standard library only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Toll" }]
keywords = ["robinhood-chain", "erc-8004", "erc-8265", "presign", "stock-tokens", "x402", "mcp", "ai-agent", "rug-check", "larp", "toll"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://t0ll.xyz/agents/plugins"
Documentation = "https://t0ll.xyz/llms.txt"
Repository = "https://github.com/t0ll-xyz/toll-plugins"

[tool.hatch.build.targets.wheel]
packages = ["src/toll_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
